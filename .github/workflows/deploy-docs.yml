name: Deploy RavenEye Docs

on:
  push:
    branches:
      - main
    paths:
      - raveneye-docs.html
      - privacy-policy.html
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages_gate.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate launch bundle
        run: npm run release:marketing

      - name: Confirm release metadata inputs
        run: test -f release/edge-listing.json && test -f release/policy-contract.json

      - name: Setup Pages (best effort)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Determine deployment readiness
        id: pages_gate
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build docs artifact
        if: steps.pages_gate.outputs.ready == 'true'
        run: |
          mkdir -p _site
          cp raveneye-docs.html _site/index.html
          cp raveneye-docs.html _site/raveneye-docs.html
          cp privacy-policy.html _site/privacy-policy.html
          mkdir -p _site/release
          cp release/edge-listing.json _site/release/edge-listing.json
          cp release/policy-contract.json _site/release/policy-contract.json
          cp -r dist-marketing _site/release/launch-bundle
          node -e "const fs=require('fs');const pkg=require('./package.json');const listing=require('./release/edge-listing.json');const out={name:pkg.name,version:pkg.version,docsUrl:'https://devadarshmay-eng.github.io/RavenEye/',privacyUrl:listing.privacyPolicyUrl,updatedAt:new Date().toISOString()};fs.writeFileSync('_site/release/release-metadata.json',JSON.stringify(out,null,2)+'\n');"

      - name: Upload artifact
        if: steps.pages_gate.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pages setup required
        if: steps.pages_gate.outputs.ready != 'true'
        run: |
          echo "::error::GitHub Pages is not enabled for Actions in this repository."
          echo "::error::Fix: Repository Settings > Pages > Build and deployment > Source = GitHub Actions."
          echo "::error::Then rerun this workflow."
          exit 1

  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
