name: Release RavenEye Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Validate tag version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          VERSION_CLEAN=${VERSION#v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION_CLEAN" ]; then
            echo "Tag version $VERSION_CLEAN does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build and lint
        run: |
          npm run build
          npm run lint

      - name: Package extension as ZIP
        run: |
          cd dist-extension
          zip -r ../raveneye-${{ steps.get_version.outputs.VERSION }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: RavenEye ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🦅 RavenEye ${{ steps.get_version.outputs.VERSION }}
            
            ### Installation
            1. Download `raveneye-${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract the ZIP
            3. Go to `chrome://extensions/`
            4. Enable Developer Mode
            5. Click "Load unpacked" and select the extracted folder
          files: raveneye-${{ steps.get_version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
