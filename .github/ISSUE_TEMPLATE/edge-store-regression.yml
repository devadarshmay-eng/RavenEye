name: Edge Store Regression
description: Report a production issue affecting the Edge Add-ons listing or submission flow.
title: "[edge-store] "
labels:
  - edge-store
  - regression
body:
  - type: textarea
    id: summary
    attributes:
      label: What broke?
      description: Describe the issue and when it started.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What user or release impact does this cause?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact steps to reproduce, including workflow run links if relevant.
    validations:
      required: true
  - type: input
    id: workflow_run
    attributes:
      label: GitHub Actions run URL
      description: Link to related run if applicable.
      placeholder: https://github.com/<owner>/<repo>/actions/runs/...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/errors
      description: Paste key error lines from workflow logs or Edge API responses.
